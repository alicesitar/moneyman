name: Scrape
on:
  workflow_dispatch:
env:
  REGISTRY: ghcr.io
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Pull container image
        run: docker pull ghcr.io/alicesitar/moneyman:latest

      - name: Run scraper, capture encrypted log
        run: |
          set +e
          docker run --rm \
            -e MONEYMAN_CONFIG \
            -e MONEYMAN_UNSAFE_STDOUT \
            -e DEBUG \
            -e TZ \
            ghcr.io/alicesitar/moneyman:latest > log.txt 2>&1
          echo "docker_exit_code=$?" >> log.txt
          openssl enc -aes-256-cbc -pbkdf2 -pass env:LOG_KEY -in log.txt -out log.enc
        env:
          MONEYMAN_CONFIG: ${{ secrets.MONEYMAN_CONFIG }}
          MONEYMAN_UNSAFE_STDOUT: "true"
          DEBUG: "moneyman:*"
          TZ: "Asia/Jerusalem"
          LOG_KEY: ${{ secrets.LOG_KEY }}

      - name: Upload encrypted log
        uses: actions/upload-artifact@v4
        with:
          name: enc-log
          path: log.enc
          retention-days: 1
